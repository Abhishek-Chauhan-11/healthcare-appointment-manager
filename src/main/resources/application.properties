spring.application.name=appointment-manager

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/healthcaredb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Optional integrations. The application remains fully usable without these keys.
# Gemini is the primary LLM provider. OpenAI remains available as an optional fallback.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

app.sendgrid.api-key=${SENDGRID_API_KEY:}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
app.sendgrid.from-name=${SENDGRID_FROM_NAME:Healthcare Appointment Manager}

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/calendar/callback}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>All Appointments</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Portal</a></div></nav><main class="container py-5"><h1>All appointments</h1><p class="text-muted">Operational clinic view. Clinical notes are intentionally excluded.</p><div class="alert alert-info" th:if="${#lists.isEmpty(appointments)}">No appointments yet.</div><div class="table-responsive" th:unless="${#lists.isEmpty(appointments)}"><table class="table table-hover bg-white"><thead class="table-primary"><tr><th>ID</th><th>Date & time</th><th>Doctor</th><th>Patient</th><th>Urgency</th><th>Status</th></tr></thead><tbody><tr th:each="a : ${appointments}"><td th:text="${a.id}"></td><td><span th:text="${a.appointmentDate}"></span><br><small><span th:text="${a.startTime}"></span>–<span th:text="${a.endTime}"></span></small></td><td th:text="${a.doctor.user.fullName}"></td><td><span th:text="${a.patient.fullName}"></span><br><small class="text-muted" th:text="${a.patient.email}"></small></td><td th:text="${a.urgencyLevel}"></td><td><span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(a.status.name())}" th:text="${a.status}"></span></td></tr></tbody></table></div><a th:href="@{/admin/dashboard}" class="btn btn-link ps-0">← Dashboard</a></main></body></html>

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthcare}}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

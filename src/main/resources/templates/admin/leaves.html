<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Doctor Leave</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Portal</a><form th:action="@{/logout}" method="post"><button class="btn btn-light">Logout</button></form></div></nav><main class="container py-5"><h1>Doctor leave management</h1><p class="text-muted">Adding leave cancels affected bookings, frees those slots, removes connected calendar events, and notifies patients.</p><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="card border-0 shadow-sm mb-5"><div class="card-body"><form th:action="@{/admin/leaves}" method="post" class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Doctor</label><select class="form-select" name="doctorId" required><option value="">Select</option><option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.user.fullName + ' — ' + d.specialization}"></option></select></div><div class="col-md-3"><label class="form-label">Date</label><input class="form-control" type="date" name="date" th:min="${minimumDate}" required></div><div class="col-md-3"><label class="form-label">Reason</label><input class="form-control" name="reason" placeholder="Unavailable"></div><div class="col-md-2 d-grid"><button class="btn btn-primary">Add Leave</button></div></form></div></div>
    <h2 class="h4">Recorded leave</h2><div class="alert alert-info" th:if="${#lists.isEmpty(leaves)}">No leave dates recorded.</div><div class="table-responsive" th:unless="${#lists.isEmpty(leaves)}"><table class="table table-hover bg-white"><thead class="table-primary"><tr><th>Date</th><th>Doctor</th><th>Reason</th><th></th></tr></thead><tbody><tr th:each="leave : ${leaves}"><td th:text="${leave.leaveDate}"></td><td th:text="${leave.doctor.user.fullName}"></td><td th:text="${leave.reason}"></td><td><form th:action="@{/admin/leaves/{id}/delete(id=${leave.id})}" method="post"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Remove this leave entry?')">Remove</button></form></td></tr></tbody></table></div><a th:href="@{/admin/dashboard}" class="btn btn-link ps-0">← Dashboard</a></main></body></html>

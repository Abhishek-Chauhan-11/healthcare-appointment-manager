<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Find Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/patient/dashboard}">Patient Portal</a><form th:action="@{/logout}" method="post"><button class="btn btn-light">Logout</button></form></div></nav>
<main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1>Find a doctor</h1><p class="text-muted mb-0">Search by specialty, then select a time.</p></div><a th:href="@{/patient/appointments}" class="btn btn-outline-primary">My Appointments</a></div>
    <form method="get" th:action="@{/patient/doctors}" class="card card-body border-0 shadow-sm mb-4"><div class="row g-2"><div class="col-md-9"><input class="form-control" name="specialization" th:value="${specialization}" placeholder="e.g. General Medicine, Cardiology"></div><div class="col-md-3 d-grid"><button class="btn btn-primary">Search</button></div></div></form>
    <div th:if="${#lists.isEmpty(doctors)}" class="alert alert-info">No active doctors match this search.</div>
    <div class="row g-4"><div class="col-md-6 col-lg-4" th:each="doctor : ${doctors}"><article class="dashboard-card">
        <span class="badge text-bg-primary mb-2" th:text="${doctor.specialization}">Specialty</span><h3 class="h5" th:text="${doctor.user.fullName}">Doctor</h3>
        <p class="text-muted" th:text="${doctor.qualification}">Qualification</p><dl class="row small mb-3"><dt class="col-6">Experience</dt><dd class="col-6"><span th:text="${doctor.experienceYears}">0</span> years</dd><dt class="col-6">Consultation</dt><dd class="col-6">₹<span th:text="${doctor.consultationFee}">0</span></dd><dt class="col-6">Hours</dt><dd class="col-6"><span th:text="${doctor.workingStartTime}"></span>–<span th:text="${doctor.workingEndTime}"></span></dd></dl>
        <a class="btn btn-primary" th:href="@{/patient/doctors/{id}/book(id=${doctor.id})}">Choose appointment</a></article></div></div>
    <a th:href="@{/patient/dashboard}" class="btn btn-link mt-4 ps-0">← Dashboard</a></main></body></html>

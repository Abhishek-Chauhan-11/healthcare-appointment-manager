<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Healthcare Manager</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/brand-mark.svg}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<section class="auth-section">
    <div class="auth-card">
        <a class="auth-brand text-decoration-none" th:href="@{/}">
            <img th:src="@{/images/brand-mark.svg}" alt="">
            <span>Healthcare Appointment Manager</span>
        </a>
        <h2>Welcome Back</h2>
        <p class="text-muted">Login to your healthcare account</p>

        <div class="alert alert-danger" th:if="${param.error}">
            Invalid email or password.
        </div>

        <div class="alert alert-success" th:if="${param.registered}">
            Registration successful. You can now log in.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>
        </form>

        <p class="text-center mt-3">
            New patient?
            <a href="/register">Create an account</a>
        </p>

        <p class="text-center">
            <a href="/">Return to home</a>
        </p>
    </div>
</section>

</body>
</html>

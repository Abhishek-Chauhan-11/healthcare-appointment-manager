<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Visit Notes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/doctor/dashboard}">Doctor Portal</a></div></nav><main class="container py-5 page-narrow"><a th:href="@{/doctor/appointments/{id}(id=${appointment.id})}" class="btn btn-link ps-0">← Appointment details</a><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3">Visit record</h1><p class="text-muted">Patient: <span th:text="${appointment.patient.fullName}"></span></p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/doctor/appointments/{id}/visit(id=${appointment.id})}" method="post">
    <label class="form-label" for="clinicalNotes">Clinical notes</label><textarea class="form-control mb-3" id="clinicalNotes" name="clinicalNotes" rows="7" required th:text="${appointment.clinicalNotes}"></textarea><label class="form-label" for="prescription">Prescription</label><textarea class="form-control mb-3" id="prescription" name="prescription" rows="4" th:text="${appointment.prescription}"></textarea><label class="form-label" for="followUp">Follow-up instructions</label><textarea class="form-control mb-3" id="followUp" name="followUp" rows="3" th:text="${appointment.followUpInstructions}"></textarea>
    <h2 class="h5 mt-4">Medication reminders</h2><p class="text-muted small">Select None when reminder scheduling is not required.</p><div class="row g-3"><div class="col-md-4"><label class="form-label">Frequency</label><select class="form-select" name="frequency"><option th:each="f : ${frequencies}" th:value="${f}" th:text="${#strings.replace(f.name(), '_', ' ')}" th:selected="${appointment.medicationFrequency == f}"></option></select></div><div class="col-md-4"><label class="form-label">Start date</label><input class="form-control" type="date" name="medicationStart" th:value="${appointment.medicationStartDate}"></div><div class="col-md-4"><label class="form-label">End date</label><input class="form-control" type="date" name="medicationEnd" th:value="${appointment.medicationEndDate}"></div></div><button class="btn btn-primary btn-lg mt-4">Save & generate summary</button></form></div></div></main></body></html>

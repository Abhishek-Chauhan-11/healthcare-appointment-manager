<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reschedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/patient/dashboard}">Patient Portal</a>
    </div>
</nav>

<main class="container py-5 page-narrow">
    <a th:href="@{/patient/appointments}" class="btn btn-link ps-0">← My appointments</a>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3">Reschedule appointment</h1>
            <p class="text-muted">With <span th:text="${appointment.doctor.user.fullName}"></span></p>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form method="get"
                  th:action="@{/patient/appointments/{id}/reschedule(id=${appointment.id})}"
                  class="mb-4">
                <label class="form-label" for="rescheduleDate">New date</label>
                <div class="input-group">
                    <input id="rescheduleDate"
                           class="form-control"
                           type="date"
                           name="date"
                           th:value="${selectedDate}"
                           th:min="${minimumDate}"
                           onchange="this.form.requestSubmit()"
                           required>
                    <button class="btn btn-outline-primary" type="submit">Show slots</button>
                </div>
                <div class="form-text">Changing the date automatically refreshes its available slots.</div>
            </form>

            <div class="alert alert-warning" th:if="${#lists.isEmpty(slots)}">
                No slots available on this date.
            </div>

            <form th:unless="${#lists.isEmpty(slots)}"
                  th:action="@{/patient/appointments/{id}/reschedule(id=${appointment.id})}"
                  method="post">
                <input type="hidden" name="date" th:value="${selectedDate}">

                <p class="fw-semibold mb-3">
                    Available slots for <span th:text="${selectedDate}">selected date</span>
                </p>

                <label class="form-label">New time</label>
                <div class="slot-grid mb-4">
                    <label class="slot-option" th:each="slot : ${slots}">
                        <input type="radio" name="startTime" th:value="${slot}" required>
                        <span th:text="${slot}"></span>
                    </label>
                </div>

                <button class="btn btn-primary" type="submit">
                    Save appointment for <span th:text="${selectedDate}">selected date</span>
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>

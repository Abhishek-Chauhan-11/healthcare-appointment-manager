<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Appointments</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/patient/dashboard}">Patient Portal</a><a class="btn btn-light" th:href="@{/patient/doctors}">Book Appointment</a></div></nav><main class="container py-5"><h1>My appointments</h1><p class="text-muted">Your bookings, visit summaries, and prescriptions in one place.</p><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="alert alert-info" th:if="${#lists.isEmpty(appointments)}">You have no appointments yet.</div>
    <div class="row g-4"><div class="col-12" th:each="a : ${appointments}"><article class="appointment-card"><div class="d-flex flex-wrap justify-content-between gap-3"><div><span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(a.status.name())}" th:text="${a.status}">BOOKED</span><h2 class="h4 mt-2 mb-1" th:text="${a.doctor.user.fullName}">Doctor</h2><p class="text-muted mb-0"><span th:text="${a.doctor.specialization}"></span> · <span th:text="${a.appointmentDate}"></span> · <span th:text="${a.startTime}"></span>–<span th:text="${a.endTime}"></span></p></div><div class="d-flex gap-2 align-items-start" th:if="${a.status.name() == 'BOOKED'}"><a class="btn btn-outline-primary" th:href="@{/patient/appointments/{id}/reschedule(id=${a.id})}">Reschedule</a><form th:action="@{/patient/appointments/{id}/cancel(id=${a.id})}" method="post"><button class="btn btn-outline-danger" onclick="return confirm('Cancel this appointment?')">Cancel</button></form></div></div>
        <details class="mt-3"><summary>View health information</summary><div class="summary-panel mt-3"><h3 class="h6">Symptoms</h3><p class="pre-line" th:text="${a.symptoms}"></p><h3 class="h6">Pre-visit summary</h3><p class="pre-line" th:text="${a.preVisitSummary ?: 'Not generated'}"></p><div th:if="${a.status.name() == 'COMPLETED'}"><h3 class="h6">Visit summary</h3><p class="pre-line" th:text="${a.postVisitSummary}"></p><h3 class="h6">Prescription</h3><p class="pre-line" th:text="${a.prescription ?: 'None'}"></p><h3 class="h6">Follow-up</h3><p class="pre-line" th:text="${a.followUpInstructions ?: 'None'}"></p></div></div></details></article></div></div><a th:href="@{/patient/dashboard}" class="btn btn-link mt-4 ps-0">← Dashboard</a></main></body></html>

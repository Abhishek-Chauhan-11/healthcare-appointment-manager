<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Doctor Appointments</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/doctor/dashboard}">Doctor Portal</a><form th:action="@{/logout}" method="post"><button class="btn btn-light">Logout</button></form></div></nav><main class="container py-5"><h1>Appointments</h1><p class="text-muted">Open a patient record to review the AI pre-visit brief or complete the visit.</p><div class="alert alert-info" th:if="${#lists.isEmpty(appointments)}">No appointments are assigned to you.</div><div class="table-responsive" th:unless="${#lists.isEmpty(appointments)}"><table class="table table-hover align-middle bg-white shadow-sm"><thead class="table-primary"><tr><th>Date</th><th>Patient</th><th>Concern</th><th>Urgency</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="a : ${appointments}"><td><strong th:text="${a.appointmentDate}"></strong><br><small><span th:text="${a.startTime}"></span>–<span th:text="${a.endTime}"></span></small></td><td><span th:text="${a.patient.fullName}"></span><br><small class="text-muted" th:text="${a.patient.email}"></small></td><td class="text-truncate concern-cell" th:text="${a.symptoms}"></td><td><span class="badge" th:classappend="${a.urgencyLevel.name() == 'HIGH' ? ' text-bg-danger' : (a.urgencyLevel.name() == 'MEDIUM' ? ' text-bg-warning' : ' text-bg-success')}" th:text="${a.urgencyLevel}"></span></td><td><span th:text="${a.status}"></span></td><td><a class="btn btn-sm btn-primary" th:href="@{/doctor/appointments/{id}(id=${a.id})}">Open</a></td></tr></tbody></table></div><a th:href="@{/doctor/dashboard}" class="btn btn-link ps-0">← Dashboard</a></main></body></html>

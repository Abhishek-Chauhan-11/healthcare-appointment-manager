<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Doctor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="container py-5">
  <div class="auth-card mx-auto">
    <h2>Add Doctor</h2>

    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/admin/doctors}" method="post">

      <div class="mb-3">
        <label class="form-label">Doctor name</label>
        <input name="fullName" type="text"
               class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" type="email"
               class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input name="phone" type="text"
               class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Temporary password</label>
        <input name="password" type="password"
               minlength="8" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Specialization</label>
        <input name="specialization" type="text"
               class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Qualification</label>
        <input name="qualification" type="text"
               class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Experience in years</label>
        <input name="experienceYears" type="number"
               min="0" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Consultation fee</label>
        <input name="consultationFee" type="number"
               min="0" step="0.01"
               class="form-control" required>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Working start time</label>
          <input name="workingStartTime" type="time"
                 class="form-control" required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Working end time</label>
          <input name="workingEndTime" type="time"
                 class="form-control" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Slot duration</label>

        <select name="slotDurationMinutes"
                class="form-select" required>
          <option value="15">15 minutes</option>
          <option value="20">20 minutes</option>
          <option value="30" selected>30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="60">60 minutes</option>
        </select>
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Create Doctor
      </button>

      <a href="/admin/doctors"
         class="btn btn-outline-secondary w-100 mt-2">
        Cancel
      </a>

    </form>
  </div>
</main>

</body>
</html>

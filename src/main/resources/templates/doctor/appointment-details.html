<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Appointment Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/doctor/dashboard}">Doctor Portal</a></div></nav><main class="container py-5 page-narrow"><a th:href="@{/doctor/appointments}" class="btn btn-link ps-0">← All appointments</a><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><article class="appointment-card"><div class="d-flex flex-wrap justify-content-between gap-3"><div><span class="status-badge" th:text="${appointment.status}"></span><h1 class="h3 mt-2" th:text="${appointment.patient.fullName}">Patient</h1><p class="text-muted"><span th:text="${appointment.appointmentDate}"></span> · <span th:text="${appointment.startTime}"></span>–<span th:text="${appointment.endTime}"></span></p></div><a th:if="${appointment.status.name() == 'BOOKED' || appointment.status.name() == 'COMPLETED'}" class="btn btn-primary align-self-start" th:href="@{/doctor/appointments/{id}/visit(id=${appointment.id})}" th:text="${appointment.status.name() == 'COMPLETED' ? 'Edit visit notes' : 'Complete visit'}">Complete visit</a></div>
    <section class="summary-panel"><div class="d-flex justify-content-between"><h2 class="h5">AI pre-visit brief</h2><span class="badge" th:classappend="${appointment.urgencyLevel.name() == 'HIGH' ? ' text-bg-danger' : (appointment.urgencyLevel.name() == 'MEDIUM' ? ' text-bg-warning' : ' text-bg-success')}" th:text="${appointment.urgencyLevel}"></span></div><p class="pre-line mb-0" th:text="${appointment.preVisitSummary}"></p></section><section class="mt-4"><h2 class="h5">Patient's original description</h2><p class="pre-line" th:text="${appointment.symptoms}"></p></section>
    <section th:if="${appointment.status.name() == 'COMPLETED'}" class="summary-panel mt-4"><h2 class="h5">Completed visit</h2><h3 class="h6">Clinical notes</h3><p class="pre-line" th:text="${appointment.clinicalNotes}"></p><h3 class="h6">Patient summary</h3><p class="pre-line" th:text="${appointment.postVisitSummary}"></p><h3 class="h6">Prescription</h3><p class="pre-line" th:text="${appointment.prescription ?: 'None'}"></p><h3 class="h6">Follow-up</h3><p class="pre-line" th:text="${appointment.followUpInstructions ?: 'None'}"></p></section></article></main></body></html>
